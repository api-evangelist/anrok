- aid: anrok:anrok-transactions-api
  name: Anrok Transactions API
  description: >-
    This documentation describes how to use Anrok's Transactions API to synchronize transactions between
    Anrok and your billing system, as well as calculate sales tax for new invoices. Use of this API is
    generally recommended for sellers with custom billing systems or workflows that prevent you from using
    one of our pre-built platform integrations. Sellers utilizing Stripe Subscriptions or Checkout may
    also use this API to calculate and add tax on initial invoices, while continuing to use Anrok's Stripe
    integration to manage tax for subsequent billing cycles.


    # Invoice lifecycle

    1. When an invoice is created: the billing system should call the `createEphemeral` endpoint to calculate
    the sales tax amount.

    1. When an invoice is updated: same as above.

    1. When an invoice is finalized and ready to send to the customer: the billing system should call
    the `createOrUpdate` endpoint so that the transaction is recorded in Anrok.

    1. When an invoice is paid: Anrok does not need to be notified. Sellers are required to remit sales
    tax to a state upon invoice, not receipt of payment.


    While the above covers a standard invoice lifecycle, the Transactions API also includes endpoints
    for exceptional states like voiding and negating invoices, which are described below.
  humanURL: https://apidocs.anrok.com/
  baseURL: https://api.anrok.com
